<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="logo" aria-hidden="true">⚔️</div><div><div class="eyebrow">BROWSER CARD BATTLE · v0.1</div><h1>レスバ道場</h1></div></div>
      <div class="topright"><span class="coin" id="coin-display" aria-label="所持コイン">🪙 400</span><span class="save-state" id="save-status">● 自動セーブ</span></div>
    </header>
    <div class="hero"><div><div class="tag">ひとり用・完全無料・ログイン不要</div><h2>その一言で、流れを変えろ。</h2><p>カードの相性を読んでCPUに勝とう。5本勝負、3本先取。</p></div></div>
    <nav class="tabs" role="tablist" aria-label="ゲームメニュー">
      <button class="tab" type="button" role="tab" id="tab-battle" aria-controls="battle" aria-selected="true" data-tab="battle">⚔️ 対戦</button>
      <button class="tab" type="button" role="tab" id="tab-deck" aria-controls="deck" aria-selected="false" data-tab="deck">🃏 デッキ</button>
      <button class="tab" type="button" role="tab" id="tab-gacha" aria-controls="gacha" aria-selected="false" data-tab="gacha">🎁 ガチャ</button>
      <button class="tab" type="button" role="tab" id="tab-catalog" aria-controls="catalog" aria-selected="false" data-tab="catalog">📚 図鑑</button>
    </nav>
    <main class="content">
      <section id="battle" class="section active" role="tabpanel" aria-labelledby="tab-battle"></section>
      <section id="deck" class="section" role="tabpanel" aria-labelledby="tab-deck"></section>
      <section id="gacha" class="section" role="tabpanel" aria-labelledby="tab-gacha"></section>
      <section id="catalog" class="section" role="tabpanel" aria-labelledby="tab-catalog"></section>
    </main>
    <footer class="footer"><span>レスバ道場 v0.1 · オリジナルのブラウザゲーム</span><span>データはこのブラウザ内に保存されます。端末間の自動同期はありません。</span></footer>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script>
  (() => {
    'use strict';
    const STORAGE_KEY = 'resuba-dojo.save.v1';
    const START_COINS = 400;
    const GACHA_COST = 200;
    const TYPE = {
      '論理': {icon:'🧠', color:'#72b8ff', beats:'勢い'},

      {id:'c05',name:'スクショ保存した',type:'証拠',power:4,rarity:'N',desc:'記録は意外と強い。',starter:true},

    ];
    const CARD_BY_ID = Object.fromEntries(CARDS.map(c=>[c.id,c]));
    const START_DECK = CARDS.filter(c=>c.starter).map(c=>c.id);
    const PROMPTS = [
      {text:'「その説明、なんか矛盾してない？」',type:'論理',hint:'筋道を立てて反論しよう'},
      {text:'「結局、何が言いたいの？」',type:'論理',hint:'論点を整理できるか'},
      {text:'「話がどんどん逸れてるぞ！」',type:'論理',hint:'本題に引き戻せ'},
      {text:'「それ、どこに書いてあるの？」',type:'証拠',hint:'出典を示して説得しよう'},
      {text:'「そんな発言してないはず！」',type:'証拠',hint:'記録を確認する好機'},
      {text:'「データがないと信じられない！」',type:'証拠',hint:'根拠の強さがものを言う'},
      {text:'「ちょっと押されてるぞ！」',type:'勢い',hint:'流れを奪い返せ'},
      {text:'「盛り上がりが足りない！」',type:'勢い',hint:'勢いで押し切れるか'},
      {text:'「相手が畳みかけてきた！」',type:'勢い',hint:'ひるまず言い返そう'},
      {text:'「スレが妙に静かになった…」',type:'ネタ',hint:'空気を変えるチャンス'},
      {text:'「誰か面白いこと言って！」',type:'ネタ',hint:'笑いを取れば優勢だ'},
      {text:'「マジレスが続いている…」',type:'ネタ',hint:'ここはボケどころかも'}
    ];
    const $ = (selector, root=document) => root.querySelector(selector);
    const escapeHTML = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const shuffle = arr => {const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
    const pick = a => a[Math.floor(Math.random()*a.length)];
    const initial = () => ({version:1,coins:START_COINS,owned:[...START_DECK],deck:[...START_DECK],wins:0,losses:0,match:null});
    let canSave = true;
    function load(){
      let raw;
      try{raw=localStorage.getItem(STORAGE_KEY);}catch(err){canSave=false;return initial();}
      if(!raw)return initial();
      try{
        const v=JSON.parse(raw);
        if(!v || v.version!==1) return initial();
        const owned = [...new Set(Array.isArray(v.owned) ? v.owned.filter(id=>CARD_BY_ID[id]):START_DECK)];
        const fullOwned = [...new Set([...START_DECK,...owned])];
        let deck = Array.isArray(v.deck)?[...new Set(v.deck.filter(id=>fullOwned.includes(id)))]:[...START_DECK];
        if(deck.length!==12)deck=[...START_DECK];
        const state={version:1,coins:Number.isSafeInteger(v.coins)&&v.coins>=0?v.coins:START_COINS,owned:fullOwned,deck,wins:Number.isSafeInteger(v.wins)&&v.wins>=0?v.wins:0,losses:Number.isSafeInteger(v.losses)&&v.losses>=0?v.losses:0,match:null};
        if(v.match && validateMatch(v.match))state.match=v.match;
        return state;
      }catch(err){return initial();}
    }
    function validateMatch(m){
      return Number.isInteger(m.round)&&m.round>=0&&m.round<5 && Number.isInteger(m.wins)&&m.wins>=0&&m.wins<=3 && Number.isInteger(m.losses)&&m.losses>=0&&m.losses<=3 && Array.isArray(m.prompts)&&m.prompts.length===5&&m.prompts.every(i=>Number.isInteger(i)&&i>=0&&i<PROMPTS.length) && Array.isArray(m.hand)&&m.hand.every(id=>CARD_BY_ID[id])&&m.hand.length<=4 && Array.isArray(m.remaining)&&m.remaining.every(id=>CARD_BY_ID[id])&& ['choose','reveal','done'].includes(m.phase) && (!m.lastResult || (CARD_BY_ID[m.lastResult.player] && CARD_BY_ID[m.lastResult.cpu]));
    }
    let state=load();
    let activeTab='battle';
    let pendingCard=null;
    let pendingSlot=null;
    let gachaResult=null;
    let toastTimeout=null;
    function save(){
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));canSave=true;}
      catch(err){canSave=false;}
    }
    function toast(s){
      const el=$('#toast');el.textContent=s;el.classList.remove('hidden');
      if(toastTimeout)clearTimeout(toastTimeout);
      toastTimeout=setTimeout(()=>el.classList.add('hidden'),2600);
    }
    function cardHTML(c,options={}){
      const t=TYPE[c.type];
      const {action='',label='',selected=false,locked=false,extra=''}=options;
      const title=locked?'？？？':c.name;
      const body=locked?'ガチャで入手すると表示されます。':c.desc;
      const attr=action?` data-action="${escapeHTML(action)}" data-id="${escapeHTML(c.id)}"` : '';
      const aria=action?` aria-label="${escapeHTML(c.name)}：${escapeHTML(label)}"` : '';
      const cls=`game-card${selected?' selected':''}${locked?' locked':''}`;
      return `<${action?'button type="button"':'div'} class="${cls}" style="--card-color:${t.color}" data-glyph="${t.icon}"${attr}${aria}>
        <div class="card-top"><span class="card-type">${t.icon} ${escapeHTML(c.type)}</span><span class="card-rarity">${c.rarity==='SR'?'★★★':c.rarity==='R'?'★★':'★'} ${c.rarity}</span></div>
        <div class="card-name">${escapeHTML(title)}</div><p class="card-desc">${escapeHTML(body)}</p>
        <div class="card-foot"><span class="power">POWER <b>${locked?'?':c.power}</b></span>${label?`<span class="card-action">${escapeHTML(label)}</span>`:''}</div>
        ${extra?`<div class="card-action" style="margin-top:6px">${escapeHTML(extra)}</div>`:''}
      </${action?'button':'div'}>`;
    }
    function scoreCard(card,opp,prompt){
      return {base:card.power,topic:card.type===prompt.type?3:0,advantage:TYPE[card.type].beats===opp.type?2:0,total:card.power+(card.type===prompt.type?3:0)+(TYPE[card.type].beats===opp.type?2:0)};
    }
    function newMatch(){
      const freshDeck=shuffle(state.deck);
      const promptIds=shuffle(PROMPTS.map((_,i)=>i)).slice(0,5);
      state.match={round:0,wins:0,losses:0,prompts:promptIds,hand:freshDeck.slice(0,4),remaining:freshDeck.slice(4),phase:'choose',lastResult:null,used:[]};
      save();render();
    }
    function cpuChoose(prompt){
      const pool=CARDS.filter(c=>c.starter || c.rarity==='N');
      const choices=shuffle(pool).slice(0,4);
      if(Math.random()<.48){const matching=choices.filter(c=>c.type===prompt.type);if(matching.length)return matching.sort((a,b)=>b.power-a.power)[0];}
      return pick(choices);
    }
    function playCard(id){
      const m=state.match;
      if(!m||m.phase!=='choose'||!m.hand.includes(id))return;
      const prompt=PROMPTS[m.prompts[m.round]];
      const player=CARD_BY_ID[id],cpu=cpuChoose(prompt);
      const ps=scoreCard(player,cpu,prompt),cs=scoreCard(cpu,player,prompt);
      // 引き分けは素のPOWER、それも同じ場合は公平なコイントスで必ず決着します。
      const playerWon = ps.total!==cs.total ? ps.total>cs.total : ps.base!==cs.base?ps.base>cs.base : Math.random()<.5;
      if(playerWon)m.wins++; else m.losses++;
      m.hand=m.hand.filter(x=>x!==id);
      m.used.push(id);
      m.phase='reveal';
      m.lastResult={player:id,cpu:cpu.id,playerScore:ps,cpuScore:cs,playerWon,tie:ps.total===cs.total,round:m.round};
      save();render();
    }
    function nextRound(){
      const m=state.match;
      if(!m||m.phase!=='reveal')return;
      if(m.wins===3||m.losses===3||m.round===4){
        m.phase='done';
        const won=m.wins>m.losses;
        if(won){state.wins++;state.coins+=150;}else{state.losses++;state.coins+=70;}
      }else{
        m.round++;
        if(m.remaining.length){m.hand.push(m.remaining.shift());}
        m.phase='choose';m.lastResult=null;
      }
      save();render();
    }
    function scoreboard(m){
      const pips=(n)=>[0,1,2].map(i=>`<span class="pip${i<n?' on':''}"></span>`).join('');
      return `<div class="score-board" aria-label="勝利数 プレイヤー${m.wins} 対 CPU${m.losses}">
        <div class="score-person"><strong>YOU / あなた</strong><span class="num">${m.wins}</span><div class="wins">${pips(m.wins)}</div></div>
        <div><div class="vs">VS</div><span class="round-chip">${m.phase==='done'?'FINISH':`ROUND ${m.round+1} / 5`}</span></div>
        <div class="score-person right"><strong>CPU / 道場主</strong><span class="num">${m.losses}</span><div class="wins">${pips(m.losses)}</div></div>
      </div>`;
    }
    function guide(){return `<div class="panel"><h3>勝負のコツ</h3><p class="secondary">各カードの POWER に、お題との一致・相性ボーナスを足して競います。</p>
      <div class="how" style="margin-top:13px"><div><b>🎯 お題一致 ＋3</b>お題とカードが同じタイプなら加点。</div><div><b>⚡ 相性有利 ＋2</b>論理 → 勢い → ネタ → 証拠 → 論理 の順に有利。</div><div><b>🏆 3本先取</b>各ラウンドで1枚使用。5戦以内で3勝すれば勝ち！</div></div>
      <p class="mini-info">同点のときはPOWERの高いカードが勝利。それも同じ場合は50%の判定勝負です。</p></div>`;}
    function renderBattle(){
      const m=state.match;
      if(!m){
        return `<div class="panel intro"><div><span class="pill green">🟢 CPU対戦 / ひとり用</span><h3>言葉のカードで、<br>道場主を倒せ。</h3><p>12枚のデッキから4枚が手札に。毎ラウンド1枚を選んで、CPUのカードと対決しよう。使ったカードはその試合中は戻りません。</p><div class="stack"><button class="btn primary" data-action="start">⚔️ CPUに挑戦する</button><span class="mini-info">1試合 約2〜3分</span></div></div><div class="intro-mark" aria-hidden="true">🃏⚡</div></div>
        <div class="panel"><div class="panel-head"><div><h3>あなたの戦績</h3><p>自動保存されています</p></div><span class="pill gold">勝利報酬 +150 🪙</span></div><div class="stack"><div class="stat"><strong>${state.wins}</strong><span>勝利</span></div><div class="stat"><strong>${state.losses}</strong><span>敗北</span></div><div class="stat"><strong>${state.wins+state.losses}</strong><span>総試合数</span></div></div></div>${guide()}`;
      }
      let html=scoreboard(m);
      if(m.phase==='choose'){
        const prompt=PROMPTS[m.prompts[m.round]];
        html+=`<div class="prompt"><span class="pill green">お題 ${m.round+1} / 5</span><span class="pill">${TYPE[prompt.type].icon} ${prompt.type} が有利 +3</span><h3>${escapeHTML(prompt.text)}</h3><p>${escapeHTML(prompt.hint)}</p></div>`;
        html+=`<div class="hand-header"><h3>使うカードを選ぼう</h3><p>手札 ${m.hand.length} 枚 / 使用済み ${m.used.length} 枚</p></div>`;
        html+=`<div class="card-grid">${m.hand.map(id=>cardHTML(CARD_BY_ID[id],{action:'play',label:CARD_BY_ID[id].type===prompt.type?'お題一致 +3':'使用する'})).join('')}</div>`;
        html+=`<div class="notice" style="margin-top:14px"><b>ヒント：</b> 相手のカードは選択後に公開。カードのPOWERとお題のタイプを見て選ぼう！</div>`;
      }else if(m.phase==='reveal'){
        const r=m.lastResult,p=CARD_BY_ID[r.player],c=CARD_BY_ID[r.cpu];
        html+=`<div class="panel result-panel" aria-live="polite"><span class="pill ${r.playerWon?'green':'pink'}">第 ${r.round+1} ラウンド結果</span><div class="result-title ${r.playerWon?'win':'lose'}">${r.playerWon?'あなたの勝ち！ ✨':'CPUの勝ち！ 💥'}</div>
          <div class="versus"><div>${cardHTML(p)}<div class="score-label">あなた <strong>${r.playerScore.total}</strong></div></div><div class="middle">VS</div><div>${cardHTML(c)}<div class="score-label">CPU <strong>${r.cpuScore.total}</strong></div></div></div>
          <div class="result-detail"><div class="cols"><div><b>あなたの得点</b><br>POWER ${r.playerScore.base} + お題 ${r.playerScore.topic} + 相性 ${r.playerScore.advantage} = <b>${r.playerScore.total}</b></div><div><b>CPUの得点</b><br>POWER ${r.cpuScore.base} + お題 ${r.cpuScore.topic} + 相性 ${r.cpuScore.advantage} = <b>${r.cpuScore.total}</b></div></div>${r.tie?'<div style="margin-top:5px">※ 合計同点のため、POWER優先／同POWER時は抽選で決着。</div>':''}</div>
          <button class="btn primary wide" data-action="next">${m.wins===3||m.losses===3||m.round===4?'試合結果を見る →':'次のラウンドへ →'}</button></div>`;
      }else{
        const won=m.wins>m.losses;
        html+=`<div class="panel result-panel" aria-live="polite"><div style="font-size:65px">${won?'🏆':'🥊'}</div><span class="pill ${won?'green':'pink'}">試合終了</span><div class="result-title ${won?'win':'lose'}">${won?'道場主に勝利！':'惜しくも敗北！'}</div><p class="secondary">${m.wins} 勝 ${m.losses} 敗で決着。<br>報酬として <strong style="color:var(--gold)">${won?150:70} コイン</strong> を獲得しました。</p><div class="stack" style="justify-content:center;margin-top:20px"><button class="btn primary" data-action="newmatch">もう一度対戦</button><button class="btn soft" data-action="jump-deck">デッキを見直す</button></div></div>`;
      }
      html+=`<div class="stack" style="justify-content:space-between;margin:14px 0"><span class="mini-info">通算 ${state.wins} 勝 / ${state.losses} 敗</span>${m.phase!=='done'?'<button class="btn soft small" data-action="restart">この試合をやり直す</button>':''}</div>`;
      html+=guide();
      return html;
    }
    function renderDeck(){
      const current=state.deck.map(id=>CARD_BY_ID[id]);
      const reserve=state.owned.filter(id=>!state.deck.includes(id)).map(id=>CARD_BY_ID[id]);
      return `<div class="panel"><div class="panel-head"><div><h3>マイデッキ</h3><p>12枚固定。タイプのバランスが大切です。</p></div><span class="pill green">${current.length} / 12 枚</span></div>
        <div class="notice"><b>入れ替え方：</b> ${pendingCard?`「${escapeHTML(CARD_BY_ID[pendingCard].name)}」を選択中。下のデッキから差し替えるカードをタップ！`:pendingSlot?`「${escapeHTML(CARD_BY_ID[pendingSlot].name)}」を交換対象に選択中。下の所持カードから入れるカードをタップ！`:'下の「控えカード」を選び、デッキ内のカードをタップして交換。デッキ側を先に選んでもOK。'}${pendingCard||pendingSlot?'<button class="btn soft small" data-action="cancel-swap" style="margin-left:8px">選択解除</button>':''}</div>
        <div class="card-grid deck-grid">${current.map(c=>cardHTML(c,{action:'deckslot',label:pendingCard?'ここに交換':'デッキ採用中',selected:pendingSlot===c.id})).join('')}</div>
        <h4 class="section-subtitle">控えカード（${reserve.length}枚）</h4>${reserve.length?`<div class="card-grid">${reserve.map(c=>cardHTML(c,{action:'reserve',label:pendingSlot?'このカードに交換':'デッキに入れる',selected:pendingCard===c.id})).join('')}</div>`:'<div class="empty">まだ控えカードがありません。ガチャで新しいカードを集めよう！</div>'}
        <p class="mini-info">※ デッキの変更は次の試合から反映されます。</p></div>`;
    }
    function renderGacha(){
      const g=gachaResult;
      return `<div class="panel"><div class="gacha-hero"><div class="gacha-symbol" aria-hidden="true">🎁</div><span class="pill gold">ゲーム内コインだけで遊べる</span><h3>新カードを引こう！</h3><p class="secondary">未所持カードを狙ってデッキを強化。実際のお金は一切使いません。</p><p style="font-size:19px;font-weight:900;margin:15px 0 9px">1回 🪙 ${GACHA_COST} <span class="mini-info">（所持 ${state.coins}）</span></p><button class="btn primary" data-action="draw" ${state.coins<GACHA_COST?'disabled':''}>✨ ガチャを1回引く</button>${state.coins<GACHA_COST?'<p class="mini-info">コイン不足。CPU対戦で獲得できます。</p>':''}</div>
        ${g?`<div class="gacha-result">${cardHTML(CARD_BY_ID[g.id])}<div><span class="pill ${g.duplicate?'pink':'green'}">${g.duplicate?'重複':'NEW!'}</span><h4>${escapeHTML(CARD_BY_ID[g.id].name)}</h4><p>${g.duplicate?'所持済みだったので60コインが戻ってきました。':'新カード獲得！デッキ画面から入れ替えできます。'}</p></div></div>`:''}
        <h4 class="section-subtitle">排出確率とルール</h4><div class="how"><div><b>★ N / 60%</b>ノーマルカード</div><div><b>★★ R / 32%</b>レアカード</div><div><b>★★★ SR / 8%</b>スーパーレア</div></div><p class="mini-info">※ 排出対象は追加カード12種類。各レアリティ内では等確率。重複時は60コイン返還。天井や未所持保証はありません。</p></div><div style="text-align:right;margin:6px 0 15px"><button class="btn warn small" data-action="reset">⚠ ゲームデータを初期化</button></div>`;
    }
    function renderCatalog(){
      const owned=new Set(state.owned);
      return `<div class="panel"><div class="panel-head"><div><h3>カード図鑑</h3><p>全部で24種類。未入手のカードは？？？で表示。</p></div><span class="pill gold">${owned.size} / ${CARDS.length} 種</span></div><div class="card-grid catalog">${CARDS.map(c=>cardHTML(c,{locked:!owned.has(c.id),extra:owned.has(c.id)?(state.deck.includes(c.id)?'デッキ採用中':'所持'):'未入手'})).join('')}</div></div>`;
    }
    function render(){
      $('#coin-display').textContent=`🪙 ${state.coins.toLocaleString('ja-JP')}`;
      const status=$('#save-status');status.textContent=canSave?'● 自動セーブ':'⚠ 保存できません';status.classList.toggle('failed',!canSave);
      const renderers={battle:renderBattle,deck:renderDeck,gacha:renderGacha,catalog:renderCatalog};
      // アクティブな画面のみ描画して、画面遷移・スマホ操作を軽く保ちます。
      for(const tab of Object.keys(renderers)){
        const panel=$('#'+tab),button=$('#tab-'+tab),on=activeTab===tab;
        panel.classList.toggle('active',on);button.setAttribute('aria-selected',String(on));
        button.tabIndex=on?0:-1;
        if(on)panel.innerHTML=renderers[tab]();
      }
    }
    function setTab(tab){
      if(!['battle','deck','gacha','catalog'].includes(tab))return;
      activeTab=tab;render();
    }
    function swap(outId,inId){
      if(!state.deck.includes(outId)||!state.owned.includes(inId)||state.deck.includes(inId)||outId===inId)return;
      state.deck=state.deck.map(id=>id===outId?inId:id);
      pendingCard=null;pendingSlot=null;
      save();render();toast('デッキを入れ替えました。次の試合から有効！');
    }
    function drawGacha(){
      if(state.coins<GACHA_COST){toast('コインが足りません。');return;}
      const rate=Math.random(),rarity=rate<.60?'N':rate<.92?'R':'SR';
      const candidates=CARDS.filter(c=>!c.starter && c.rarity===rarity);
      const c=pick(candidates),duplicate=state.owned.includes(c.id);
      state.coins-=GACHA_COST;
      if(duplicate)state.coins+=60;else state.owned.push(c.id);
      gachaResult={id:c.id,duplicate};
      save();render();
    }
    function resetAll(){
      if(!confirm('レスバ道場の戦績・所持カード・コインをすべて初期化します。元に戻せません。実行しますか？'))return;
      state=initial();pendingCard=null;pendingSlot=null;gachaResult=null;
      try{localStorage.removeItem(STORAGE_KEY);}catch(err){canSave=false;}
      save();render();toast('ゲームデータを初期化しました。');
    }
    document.addEventListener('click',e=>{
      const tab=e.target.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return;}
      const el=e.target.closest('[data-action]');if(!el)return;
      const action=el.dataset.action,id=el.dataset.id;
      if(action==='start'||action==='newmatch'){newMatch();return;}
      if(action==='play'){playCard(id);return;}
      if(action==='next'){nextRound();return;}
      if(action==='restart'){
        if(confirm('現在の試合を破棄して、最初からやり直しますか？（コインは獲得できません）'))newMatch();return;
      }
      if(action==='jump-deck'){setTab('deck');return;}
      if(action==='deckslot'){
        if(pendingCard)swap(id,pendingCard);
        else {pendingSlot=pendingSlot===id?null:id;render();}
        return;
      }
      if(action==='reserve'){
        if(!state.owned.includes(id)||state.deck.includes(id))return;
        if(pendingSlot)swap(pendingSlot,id);
        else{pendingCard=pendingCard===id?null:id;render();}
        return;
      }
      if(action==='cancel-swap'){pendingCard=null;pendingSlot=null;render();return;}
      if(action==='draw'){drawGacha();return;}
      if(action==='reset'){resetAll();return;}
    });
    document.addEventListener('keydown',e=>{
      if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
        e.preventDefault();const t=['battle','deck','gacha','catalog'];let i=t.indexOf(activeTab);
        i=e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:3))%4;
        setTab(t[i]);$('#tab-'+t[i]).focus();
      }
    });
    // 初期データは他アプリのlocalStorageを触らない固有キーで保存します。
    save();render();
  })();
  </script>
</body>
</html>
